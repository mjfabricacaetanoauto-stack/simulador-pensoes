function migrateData(d) {
  let changed = false;
  if (!d.customCats)   { d.customCats = {};   changed = true; }
  if (!d.archivedCats) { d.archivedCats = {}; changed = true; }
  (d.txs||[]).forEach(t=>{
    const m = RENAME_MAP[t.sk];
    if (m && m[t.cat]) { t.cat = m[t.cat]; changed = true; }
  });
  const b = d.budgets||{};
  Object.keys(b).forEach(y=>{
    Object.keys(b[y]||{}).forEach(mo=>{
      Object.keys(b[y][mo]||{}).forEach(sk=>{
        const m = RENAME_MAP[sk];
        if (!m) return;
        const obj = b[y][mo][sk];
        Object.keys(m).forEach(oldC=>{
          if (obj && obj[oldC]!==undefined) {
            obj[m[oldC]] = (obj[m[oldC]]||0) + obj[oldC];
            delete obj[oldC];
            changed = true;
          }
        });
      });
    });
  });
  return changed;
}

// ── Parser CSV ───────────────────────────────────────────────────
const parseCSV = text => {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if (lines.length < 2) return [];
  const sep = (lines[0].split(";").length > lines[0].split(",").length) ? ";" : ",";
  const clean = s => s.replace(/^"+|"+$/g,"").trim();
  const headers = lines[0].split(sep).map(h=>normStr(clean(h)));
  return lines.slice(1).map(line=>{
    const cols = line.split(sep).map(clean);
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = cols[i]||""; });
    return obj;
  });
};
const parseDate = s => {
  if (!s) return todayStr();
  const m1 = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (m1) {
    const y = m1[3].length===2 ? "20"+m1[3] : m1[3];
    return y+"-"+m1[2].padStart(2,"0")+"-"+m1[1].padStart(2,"0");
  }
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2) return m2[0];
  return todayStr();
};
const parseVal = s => {
  const v = (s||"0").toString().replace("€","").replace(/\s/g,"").replace(",",".");
  return Math.abs(parseFloat(v)||0);
};

// ── Parser de extratos em texto/PDF ──────────────────────────────
// Procura linhas com data + valor(es). Em extratos bancários típicos,
// o último valor da linha é o saldo, por isso usa o penúltimo quando há 2+.
const parseStatementText = text => {
  const out = [];
  const lines = text.split(/\r?\n/);
  const dateRe = /(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/;
  const amtRe = /-?\d{1,3}(?:[\.\s]\d{3})*,\d{2}|-?\d+,\d{2}/g;
  lines.forEach(line=>{
    const dm = line.match(dateRe);
    if (!dm) return;
    const amounts = line.match(amtRe);
    if (!amounts || amounts.length===0) return;
    const amtStr = amounts.length>=2 ? amounts[amounts.length-2] : amounts[0];
    const amt = parseVal(amtStr);
    if (!amt) return;
    const y = dm[3].length===2 ? "20"+dm[3] : dm[3];
    const date = y+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0");
    // descrição = linha sem a(s) data(s) e sem os valores
    let desc = line.replace(dateRe,"");
    desc = desc.replace(dateRe,""); // alguns extratos têm 2 datas (mov + valor)
    amounts.forEach(a=>{ desc = desc.replace(a,""); });
    desc = desc.replace(/\s+/g," ").trim();
    out.push({date:date, desc:desc, amt:amt});
  });
  return out;
};

// Extrai texto de um PDF agrupando itens por linha (posição vertical)
const extractPdfText = async file => {
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let allText = "";
  for (let p=1; p<=pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      if (!rows[y]) rows[y] = [];
      rows[y].push({x:it.transform[4], str:it.str});
    });
    const ys = Object.keys(rows).map(Number).sort((a,b)=>b-a);
    ys.forEach(y=>{
      rows[y].sort((a,b)=>a.x-b.x);
      allText += rows[y].map(i=>i.str).join(" ") + "\n";
    });
  }
  return allText;
};

// ── Gráficos SVG nativos ─────────────────────────────────────────
function SimplePie({ data }) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total<=0) return null;
  const cx=80, cy=80, r=65;
  let angle = -Math.PI/2;
  const slices = data.map(d => {
    const frac = d.value/total;
    const a0 = angle, a1 = angle + frac*2*Math.PI;
    angle = a1;
    if (frac >= 0.999) return Object.assign({}, d, {full:true, frac:frac});
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large = frac>0.5?1:0;
    return Object.assign({}, d, {frac:frac, path:"M "+cx+" "+cy+" L "+x0+" "+y0+" A "+r+" "+r+" 0 "+large+" 1 "+x1+" "+y1+" Z"});
  });
  return (
    <div className="flex items-center gap-4 flex-wrap">
      <svg width="160" height="160" viewBox="0 0 160 160">
        {slices.map((s,i)=> s.full
          ? <circle key={i} cx={cx} cy={cy} r={r} fill={s.color}/>
          : <path key={i} d={s.path} fill={s.color} stroke="white" strokeWidth="1.5"/>)}
      </svg>
      <div className="space-y-1.5 flex-1" style={{minWidth:140}}>
        {slices.map((s,i)=>(
          <div key={i} className="flex items-center gap-2 text-xs">
            <span className="w-3 h-3 rounded-sm flex-shrink-0" style={{backgroundColor:s.color}}></span>
            <span className="text-gray-600 flex-1 truncate">{s.name}</span>
            <span className="font-semibold text-gray-700">{(s.frac*100).toFixed(0)}%</span>
            <span className="text-gray-400">{fmt(s.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function SimpleLine({ data }) {
  if (data.length<2) return null;
  const W=320, H=120, pad=10;
  const vals = data.map(d=>d.total);
  const min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
  const range = (max-min) || 1;
  const pts = data.map((d,i)=>({
    x: pad + i*(W-2*pad)/(data.length-1),
    y: H-pad - (d.total-min)/range*(H-2*pad)
  }));
  const poly = pts.map(p=>p.x+","+p.y).join(" ");
  return (
    <div>
      <svg viewBox={"0 0 "+W+" "+H} className="w-full" style={{maxHeight:140}}>
        <polyline points={poly} fill="none" stroke="#7c3aed" strokeWidth="2"/>
        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill="#7c3aed"/>)}
      </svg>
      <div className="flex justify-between text-xs text-gray-400 px-1">
        <span>{data[0].label}</span>
        <span className="font-semibold text-violet-600">{fmt(data[data.length-1].total)}</span>
        <span>{data[data.length-1].label}</span>
      </div>
    </div>
  );
}

// ── Auth Screen ──────────────────────────────────────────────────
function AuthScreen({ onLogin }) {
  const [email, setEmail]   = useState("");
  const [pass, setPass]     = useState("");
  const [mode, setMode]     = useState("login");
  const [loading, setLoading] = useState(false);
  const [error, setError]   = useState("");
  const [info, setInfo]     = useState("");

  const submit = async () => {
    if (!email || !pass) { setError("Preenche o email e a password"); return; }
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "login") {
        const res = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (res.error) throw res.error;
        onLogin(res.data.user);
      } else {
        if (pass.length < 6) throw new Error("A password deve ter pelo menos 6 caracteres");
        const res = await sb.auth.signUp({ email: email, password: pass });
        if (res.error) throw res.error;
        setInfo("Conta criada! Verifica o teu email para confirmar, depois faz login.");
        setMode("login");
      }
    } catch(e) {
      const msgs = {
        "Invalid login credentials": "Email ou password incorretos",
        "Email not confirmed": "Confirma primeiro o teu email (vê a caixa de entrada)",
        "User already registered": "Já existe uma conta com este email",
        "Signups not allowed for this instance": "O registo de novas contas está desativado"
      };
      setError(msgs[e.message] || e.message || "Erro desconhecido");
    } finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen bg-gray-50 flex items-center justify-center px-4"
      style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>
      <div className="bg-white rounded-2xl shadow-sm p-6 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="text-4xl mb-2">💰</div>
          <h1 className="text-xl font-bold text-gray-900">Orçamento Pessoal</h1>
          <p className="text-xs text-gray-400 mt-1">{mode==="login"?"Entra na tua conta":"Cria a tua conta"}</p>
        </div>
        {error ? <div className="mb-3 bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-xs text-red-700">{error}</div> : null}
        {info  ? <div className="mb-3 bg-green-50 border border-green-200 rounded-lg px-3 py-2 text-xs text-green-700">{info}</div> : null}
        <div className="space-y-3">
          <div>
            <div className="text-xs text-gray-500 mb-1">Email</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
              placeholder="o-teu@email.com"
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:border-blue-400 outline-none"/>
          </div>
          <div>
            <div className="text-xs text-gray-500 mb-1">Password</div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
              placeholder="••••••••"
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:border-blue-400 outline-none"/>
          </div>
          <button onClick={submit} disabled={loading}
            className="w-full text-white rounded-xl py-3 font-semibold text-sm disabled:opacity-50"
            style={{backgroundColor:"#2563eb"}}>
            {loading ? "A processar..." : (mode==="login" ? "Entrar" : "Criar conta")}
          </button>
        </div>
        <div className="text-center mt-4">
          <button onClick={()=>{setMode(mode==="login"?"register":"login");setError("");setInfo("");}}
            className="text-xs text-blue-600">
            {mode==="login" ? "Não tens conta? Regista-te" : "Já tens conta? Entra"}
          </button>
        </div>
        <div className="mt-5 pt-4 border-t border-gray-100 text-center text-xs text-gray-300">
          🔒 Os teus dados são privados e protegidos
        </div>
      </div>
    </div>
  );
}

// ── App raiz ─────────────────────────────────────────────────────
function App() {
  const [user, setUser]   = useState(null);
  const [authReady, setAuthReady] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(res => {
      setUser(res.data.session ? res.data.session.user : null);
      setAuthReady(true);
    });
    const sub = sb.auth.onAuthStateChange((_e, session) => {
      setUser(session ? session.user : null);
    });
    return () => sub.data.subscription.unsubscribe();
  }, []);

  if (!authReady) return <div className="flex h-screen items-center justify-center bg-gray-50 text-gray-400 text-sm">A carregar...</div>;
  if (!user) return <AuthScreen onLogin={setUser}/>;
  return <Budget user={user} onLogout={()=>sb.auth.signOut()}/>;
}

  const [tab, setTab]           = useState("resumo");
  const [data, setData]         = useState(null);
  const [saving, setSaving]     = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [budgetDraft, setBudgetDraft] = useState({});
  const [formDate, setFormDate]     = useState(todayStr());
  const [formAmount, setFormAmount] = useState("");
  const [formDesc, setFormDesc]     = useState("");
  const [formSection, setFormSection] = useState("essenciais");
  const [formCat, setFormCat]       = useState("Supermercado");
  const [formAccFrom, setFormAccFrom] = useState("");
  const [formAccTo, setFormAccTo]     = useState("");
  const [toast, setToast]           = useState(null);
  const [accName, setAccName]   = useState("");
  const [accType, setAccType]   = useState("ordem");
  const [accBal, setAccBal]     = useState("");
  const [showAccForm, setShowAccForm] = useState(false);
  const [editingAcc, setEditingAcc]   = useState(null);
  const [editBalVal, setEditBalVal]   = useState("");
  const [confirmDel, setConfirmDel]   = useState(null);
  const [undoSnap, setUndoSnap]       = useState(null);
  const [showMenu, setShowMenu]       = useState(false);
  const [importMode, setImportMode]   = useState(null);
  const [importRows, setImportRows]   = useState([]);
  const [importAcc, setImportAcc]     = useState("");
  const [importSel, setImportSel]     = useState({});
  // edição de lançamentos
  const [editTx, setEditTx]           = useState(null);
  // seleção múltipla
  const [selMode, setSelMode]         = useState(false);
  const [selTxs, setSelTxs]           = useState({});
  // gestão de categorias
  const [catMgr, setCatMgr]           = useState(false);
  const [newCatName, setNewCatName]   = useState({});
  // vista de gráficos
  const [chartView, setChartView]     = useState("mes");
  const undoTimer = useRef(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await sb.from("budget_data").select("data").eq("user_id", user.id).maybeSingle();
        const d = res.data ? res.data.data : JSON.parse(JSON.stringify(EMPTY_DATA));
        if (!d.customCats) d.customCats = {};
        if (!d.archivedCats) d.archivedCats = {};
        const changed = migrateData(d);
        setData(d);
        if (changed && res.data) {
          await sb.from("budget_data").update({ data: d, updated_at: new Date().toISOString() }).eq("user_id", user.id);
        }
      } catch(e) { setData(JSON.parse(JSON.stringify(EMPTY_DATA))); }
    })();
  }, [user.id]);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 2500); };

  const persist = d => {
    setData(d);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true);
      try {
        const res = await sb.from("budget_data").select("id").eq("user_id", user.id).maybeSingle();
        if (res.data) {
          await sb.from("budget_data").update({ data: d, updated_at: new Date().toISOString() }).eq("user_id", user.id);
        } else {
          await sb.from("budget_data").insert({ user_id: user.id, data: d });
        }
      } catch(e) { showToast("⚠️ Erro ao guardar — verifica a ligação"); }
      setSaving(false);
    }, 800);
  };

  if (!data) return <div className="flex h-screen items-center justify-center bg-gray-50 text-gray-400 text-sm">A carregar dados...</div>;

  // ── Categorias (base + personalizadas, menos arquivadas) ──
  const catsOf = sk => SECTIONS[sk].items.concat(data.customCats[sk]||[]);
  const isArchived = (sk,cat) => (data.archivedCats[sk]||[]).indexOf(cat)>=0;
  const activeCatsOf = sk => catsOf(sk).filter(c=>!isArchived(sk,c));

  // ── Derived ──
  const accTxDelta = (accId, txs) => {
    let delta = 0;
    txs.forEach(t => {
      if (t.accTo === accId)   delta += t.amt;
      if (t.accFrom === accId) delta -= t.amt;
    });
    return delta;
  };
  const accBalance  = a => isAuto(a) ? a.base + accTxDelta(a.id, data.txs) : a.base;
  const totalWealth = data.accounts.reduce((s,a)=>s+accBalance(a), 0);
  const accNameOf   = id => { const a = data.accounts.find(x=>x.id===id); return a ? a.name : ""; };

  const monthTxs = data.txs.filter(t => {
    const d = new Date(t.date+"T12:00:00");
    return d.getFullYear()===year && d.getMonth()===month;
  });

  const real = {};
  Object.keys(SECTIONS).forEach(sk => { real[sk]={}; catsOf(sk).forEach(c=>{ real[sk][c]=0; }); });
  monthTxs.forEach(t => {
    if(isTransfer(t)) return;
    if(!real[t.sk]) return;
    if(real[t.sk][t.cat]===undefined) real[t.sk][t.cat]=0;
    real[t.sk][t.cat]+=t.amt;
  });

  const bp = (sk,cat) => {
    const y = data.budgets[year]; if (!y) return 0;
    const m = y[month]; if (!m) return 0;
    const s = m[sk]; if (!s) return 0;
    return s[cat]||0;
  };
  const allCatsWithData = sk => {
    const set = {};
    catsOf(sk).forEach(c=>{ set[c]=true; });
    Object.keys(real[sk]).forEach(c=>{ set[c]=true; });
    return Object.keys(set);
  };
  const stot = sk => {
    let p=0,r=0;
    allCatsWithData(sk).forEach(c=>{
      const s=iSign(sk,c);
      p+=s*bp(sk,c);
      r+=s*(real[sk][c]||0);
    });
    return {p:p,r:r};
  };
  const tR=stot("rendimentos"), tP=stot("poupancas"), tE=stot("essenciais"), tV=stot("variaveis");
  const saldoR=tR.r-tP.r-tE.r-tV.r, saldoP=tR.p-tP.p-tE.p-tV.p;
  const taxaPoup = tR.r>0 ? tP.r/tR.r*100 : 0;
  let saldoAcc = 0;
  data.txs.forEach(t=>{
    if(isTransfer(t)) return;
    if(!SECTIONS[t.sk]) return;
    const d=new Date(t.date+"T12:00:00"), ty=d.getFullYear(), tm=d.getMonth();
    if(ty<year||(ty===year&&tm<=month)) saldoAcc+=SECTIONS[t.sk].sign*iSign(t.sk,t.cat)*t.amt;
  });

  // ── Actions ──
  const addTx = () => {
    const amt=pn(formAmount);
    if(!amt) { showToast("⚠️ Insere um valor"); return; }
    if (formSection==="transfer") {
      if (!formAccFrom||!formAccTo) { showToast("⚠️ Escolhe as duas contas"); return; }
      if (formAccFrom===formAccTo)  { showToast("⚠️ As contas têm de ser diferentes"); return; }
      persist(Object.assign({}, data, {txs:data.txs.concat([{id:uid(),date:formDate,amt:amt,desc:formDesc.trim(),sk:"transfer",cat:"Transferência",accFrom:formAccFrom,accTo:formAccTo}])}));
      setFormAmount(""); setFormDesc(""); showToast("🔁 Transferência registada"); return;
    }
    const tx={id:uid(),date:formDate,amt:amt,desc:formDesc.trim(),sk:formSection,cat:formCat};
    if (formSection==="rendimentos") {
      if (formAccFrom) { if (isDed(formSection,formCat)) tx.accFrom=formAccFrom; else tx.accTo=formAccFrom; }
    } else if (formSection==="poupancas") {
      if (formAccFrom) tx.accFrom=formAccFrom;
      if (formAccTo)   tx.accTo=formAccTo;
    } else {
      if (formAccFrom) tx.accFrom=formAccFrom;
    }
    persist(Object.assign({}, data, {txs:data.txs.concat([tx])}));
    setFormAmount(""); setFormDesc(""); showToast("✅ Lançamento adicionado");
  };

  const askDelTx  = t => setConfirmDel({type:"tx", id:t.id, label:t.desc||t.cat, detail:fmt(t.amt)+" · "+t.date.slice(5).replace("-","/")});
  const askDelAcc = a => {
    const n=data.txs.filter(t=>t.accFrom===a.id||t.accTo===a.id).length;
    setConfirmDel({type:"acc", id:a.id, label:a.name, detail:n>0?(n+" lançamento(s) ligado(s) — não serão apagados"):"Sem lançamentos ligados"});
  };
  const askDelMulti = () => {
    const ids = Object.keys(selTxs).filter(id=>selTxs[id]);
    if (!ids.length) { showToast("⚠️ Nenhum lançamento selecionado"); return; }
    setConfirmDel({type:"multi", ids:ids, label:ids.length+" lançamentos", detail:"Esta ação apaga todos os selecionados"});
  };
  const execDelete = () => {
    const snap = JSON.parse(JSON.stringify(data));
    if (confirmDel.type==="tx") {
      persist(Object.assign({}, data, {txs:data.txs.filter(t=>t.id!==confirmDel.id)}));
    } else if (confirmDel.type==="multi") {
      const ids = confirmDel.ids;
      persist(Object.assign({}, data, {txs:data.txs.filter(t=>ids.indexOf(t.id)<0)}));
      setSelMode(false); setSelTxs({});
    } else {
      persist(Object.assign({}, data, {accounts:data.accounts.filter(a=>a.id!==confirmDel.id)}));
    }
    setConfirmDel(null);
    setUndoSnap(snap);
    if (undoTimer.current) clearTimeout(undoTimer.current);
    undoTimer.current = setTimeout(()=>setUndoSnap(null), 6000);
  };
  const undo = () => {
    if (!undoSnap) return;
    persist(undoSnap); setUndoSnap(null);
    if (undoTimer.current) clearTimeout(undoTimer.current);
    showToast("↩️ Recuperado!");
  };

  // edição de lançamento
  const openEditTx = t => {
    setEditTx({id:t.id, sk:t.sk, cat:t.cat, amt:t.amt.toString().replace(".",","), date:t.date, desc:t.desc||"", accFrom:t.accFrom||"", accTo:t.accTo||""});
  };
  const saveEditTx = () => {
    const amt = pn(editTx.amt);
    if (!amt) { showToast("⚠️ Insere um valor válido"); return; }
    const txs = data.txs.map(t=>{
      if (t.id!==editTx.id) return t;
      const nt = {id:t.id, date:editTx.date, amt:amt, desc:editTx.desc.trim(), sk:editTx.sk, cat:editTx.cat};
      if (editTx.accFrom) nt.accFrom=editTx.accFrom;
      if (editTx.accTo)   nt.accTo=editTx.accTo;
      return nt;
    });
    persist(Object.assign({}, data, {txs:txs}));
    setEditTx(null); showToast("💾 Lançamento atualizado");
  };

  const enterEditMode = () => {
    const draft={};
    Object.keys(SECTIONS).forEach(sk=>allCatsWithData(sk).forEach(c=>{ const v=bp(sk,c); if(v>0) draft[sk+"|"+c]=v.toString(); }));
    setBudgetDraft(draft); setEditMode(true);
  };
  const saveBudget = () => {
    const nb=JSON.parse(JSON.stringify(data.budgets||{}));
    if(!nb[year]) nb[year]={};
    if(!nb[year][month]) nb[year][month]={};
    Object.keys(budgetDraft).forEach(key=>{
      const idx = key.indexOf("|");
      const sk = key.slice(0,idx), cat = key.slice(idx+1);
      if(!nb[year][month][sk]) nb[year][month][sk]={};
      const v=pn(budgetDraft[key]);
      if(v>0) nb[year][month][sk][cat]=v;
      else if (nb[year][month][sk]) delete nb[year][month][sk][cat];
    });
    persist(Object.assign({}, data, {budgets:nb}));
    setBudgetDraft({}); setEditMode(false); showToast("💾 Orçamento guardado");
  };
  const copyPrevMonth = () => {
    const pm=month===0?11:month-1, py=month===0?year-1:year;
    const prevY = data.budgets[py];
    const prev = prevY ? prevY[pm] : null;
    if(!prev){showToast("⚠️ Sem orçamento no mês anterior");return;}
    const nb=JSON.parse(JSON.stringify(data.budgets||{}));
    if(!nb[year]) nb[year]={};
    nb[year][month]=JSON.parse(JSON.stringify(prev));
    persist(Object.assign({}, data, {budgets:nb}));
    showToast("📋 Copiado com sucesso");
  };
  const getBD=(sk,cat)=>{ const k=sk+"|"+cat; return (k in budgetDraft)?budgetDraft[k]:(bp(sk,cat)>0?bp(sk,cat).toString():""); };

  // categorias personalizadas
  const addCustomCat = sk => {
    const name = (newCatName[sk]||"").trim();
    if (!name) { showToast("⚠️ Escreve um nome"); return; }
    if (catsOf(sk).indexOf(name)>=0) { showToast("⚠️ Essa categoria já existe"); return; }
    const cc = JSON.parse(JSON.stringify(data.customCats));
    if (!cc[sk]) cc[sk]=[];
    cc[sk].push(name);
    persist(Object.assign({}, data, {customCats:cc}));
    setNewCatName(Object.assign({}, newCatName, {[sk]:""}));
    showToast("✅ Categoria adicionada");
  };
  const toggleArchiveCat = (sk, cat) => {
    const ac = JSON.parse(JSON.stringify(data.archivedCats));
    if (!ac[sk]) ac[sk]=[];
    const idx = ac[sk].indexOf(cat);
    if (idx>=0) ac[sk].splice(idx,1);
    else ac[sk].push(cat);
    persist(Object.assign({}, data, {archivedCats:ac}));
  };

  const snapshotWealth = (accounts,txs) => {
    const total=accounts.reduce((s,a)=>s+(isAuto(a)?a.base+accTxDelta(a.id,txs):a.base),0);
    const today=todayStr();
    const hist=(data.wealthHist||[]).filter(h=>h.date!==today);
    hist.push({date:today,total:total});
    hist.sort((a,b)=>a.date.localeCompare(b.date));
    return hist;
  };
  const addAccount = () => {
    if(!accName.trim()){showToast("⚠️ Dá um nome à conta");return;}
    const accounts=data.accounts.concat([{id:uid(),name:accName.trim(),type:accType,base:pn(accBal)}]);
    persist(Object.assign({}, data, {accounts:accounts, wealthHist:snapshotWealth(accounts,data.txs)}));
    setAccName(""); setAccBal(""); setAccType("ordem"); setShowAccForm(false); showToast("✅ Conta adicionada");
  };
  const saveAccBalance = id => {
    const target=pn(editBalVal);
    const accounts=data.accounts.map(a=>{
      if(a.id!==id) return a;
      if(isAuto(a)) return Object.assign({}, a, {base: target - accTxDelta(a.id, data.txs)});
      return Object.assign({}, a, {base: target});
    });
    persist(Object.assign({}, data, {accounts:accounts, wealthHist:snapshotWealth(accounts,data.txs)}));
    setEditingAcc(null); setEditBalVal(""); showToast("💾 Saldo atualizado");
  };

  const exportCSV = () => {
    if(data.txs.length===0){showToast("⚠️ Sem dados para exportar");return;}
    const num=v=>v.toFixed(2).replace(".",",");
    const esc=s=>'"'+(s||"").replace(/"/g,'""')+'"';
    const secLabel=sk=>sk==="transfer"?"Transferência":(SECTIONS[sk]?SECTIONS[sk].label:sk);
    let csv="\uFEFF";
    csv+="Data;Tipo;Categoria;Valor;Observações;Sai de;Entra em\n";
    data.txs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
      csv+=[t.date,esc(secLabel(t.sk)),esc(t.cat),num(t.amt),esc(t.desc),esc(accNameOf(t.accFrom)),esc(accNameOf(t.accTo))].join(";")+"\n";
    });
    if(data.accounts.length>0){
      csv+="\n\nContas;Tipo;Saldo\n";
      data.accounts.forEach(a=>{csv+=[esc(a.name),esc(ACC_TYPES[a.type]?ACC_TYPES[a.type].label:a.type),num(accBalance(a))].join(";")+"\n";});
      csv+="Total;;"+num(totalWealth)+"\n";
    }
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const el=document.createElement("a"); el.href=url; el.download="orcamento_"+todayStr()+".csv";
    document.body.appendChild(el); el.click(); document.body.removeChild(el); URL.revokeObjectURL(url);
    showToast("📤 Exportado!");
  };

  // ── Importação ──
  const buildBankRows = movs => {
    const out = [];
    movs.forEach(m=>{
      if (!m.amt) return;
      const cls = autoClassify(m.desc);
      const dup = data.txs.some(t=>t.date===m.date&&Math.abs(t.amt-m.amt)<0.01);
      out.push({_id:uid(), _dup:dup, sk:cls.sk, cat:cls.cat, amt:m.amt, date:m.date, desc:m.desc});
    });
    setImportRows(out);
    const sel={}; out.forEach(r=>{ sel[r._id]=!r._dup; });
    setImportSel(sel);
    setImportMode("bank");
    if (out.length===0) showToast("⚠️ Não encontrei movimentos — tenta a opção de colar texto");
  };

  const importFromPastedText = () => {
    const el = document.getElementById("pasteArea");
    const text = el ? el.value : "";
    if (!text.trim()) { showToast("⚠️ Cola primeiro o texto do extrato"); return; }
    const movs = parseStatementText(text);
    if (movs.length===0) { showToast("⚠️ Não encontrei movimentos no texto colado"); return; }
    buildBankRows(movs);
    if (el) el.value = "";
  };

  const handleImportFile = (e, mode) => {
    const file = e.target.files[0];
    if (!file) return;
    const isPdf = /\.pdf$/i.test(file.name) || file.type==="application/pdf";
    if (isPdf) {
      if (!window.pdfjsLib) { showToast("⚠️ Leitor de PDF indisponível — usa a opção de colar texto"); e.target.value=""; return; }
      showToast("📄 A ler o PDF...");
      extractPdfText(file).then(text=>{
        const movs = parseStatementText(text);
        if (movs.length===0) { showToast("⚠️ Não consegui extrair movimentos deste PDF — tenta colar o texto"); return; }
        buildBankRows(movs);
      }).catch(()=>{ showToast("⚠️ Erro ao ler o PDF — tenta a opção de colar texto"); });
      e.target.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const rows = parseCSV(ev.target.result);
      if (rows.length===0) { showToast("⚠️ Ficheiro vazio ou formato não reconhecido"); return; }
      if (mode==="excel") processExcelRows(rows);
      else processBankRows(rows);
      setImportMode(mode);
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = "";
  };

  const processExcelRows = rows => {
    const out = [];
    rows.forEach(r=>{
      const sk = mapTipo(r["tipo"]||r["seccao"]||"");
      let cat = r["categoria"]||"";
      // aplica renomeações antigas
      const rn = RENAME_MAP[sk];
      if (rn && rn[cat]) cat = rn[cat];
      if (catsOf(sk).indexOf(cat)<0) cat = catsOf(sk)[catsOf(sk).length-1];
      const amt = parseVal(r["valor"]);
      if (!amt) return;
      const date = parseDate(r["data"]);
      const desc = r["observacoes"]||r["descricao"]||r["obs"]||"";
      const accNm = (r["conta"]||"").toLowerCase();
      const accObj = data.accounts.find(a=>a.name.toLowerCase()===accNm);
      const accId = accObj ? accObj.id : "";
      const dup = data.txs.some(t=>t.date===date&&Math.abs(t.amt-amt)<0.01&&t.cat===cat);
      const row = {_id:uid(), _dup:dup, sk:sk, cat:cat, amt:amt, date:date, desc:desc};
      if (accId) { if (sk==="rendimentos"&&!isDed(sk,cat)) row.accTo=accId; else row.accFrom=accId; }
      out.push(row);
    });
    setImportRows(out);
    const sel={}; out.forEach(r=>{ sel[r._id]=!r._dup; });
    setImportSel(sel);
  };

  const processBankRows = rows => {
    const out = [];
    rows.forEach(r=>{
      const desc = r["descricao"]||r["description"]||r["designacao"]||r["movimento"]||r["obs"]||"";
      const amt = parseVal(r["valor"]||r["montante"]||r["amount"]||r["debito"]||r["credito"]);
      if (!amt) return;
      const date = parseDate(r["data"]||r["date"]||r["data mov"]||r["data valor"]);
      const cls = autoClassify(desc);
      const dup = data.txs.some(t=>t.date===date&&Math.abs(t.amt-amt)<0.01);
      out.push({_id:uid(), _dup:dup, sk:cls.sk, cat:cls.cat, amt:amt, date:date, desc:desc});
    });
    setImportRows(out);
    const sel={}; out.forEach(r=>{ sel[r._id]=!r._dup; });
    setImportSel(sel);
  };

  const updateImportRow = (id, field, val) => {
    setImportRows(rows=>rows.map(r=>{
      if (r._id!==id) return r;
      const nr = Object.assign({}, r); nr[field]=val;
      if (field==="sk" && catsOf(val).indexOf(nr.cat)<0) nr.cat=catsOf(val)[catsOf(val).length-1];
      return nr;
    }));
  };

  const confirmImport = () => {
    const toImport = importRows.filter(r=>importSel[r._id]);
    if (!toImport.length) { showToast("⚠️ Nenhuma linha selecionada"); return; }
    const newTxs = toImport.map(r=>{
      const tx = {id:r._id, date:r.date, amt:r.amt, desc:r.desc, sk:r.sk, cat:r.cat};
      if (r.accFrom) tx.accFrom=r.accFrom;
      if (r.accTo)   tx.accTo=r.accTo;
      if (importMode==="bank" && importAcc && !tx.accFrom && !tx.accTo) {
        if (r.sk==="rendimentos"&&!isDed(r.sk,r.cat)) tx.accTo=importAcc; else tx.accFrom=importAcc;
      }
      return tx;
    });
    persist(Object.assign({}, data, {txs:data.txs.concat(newTxs)}));
    showToast("✅ "+newTxs.length+" lançamento(s) importado(s)!");
    setImportRows([]); setImportMode(null); setImportAcc(""); setImportSel({});
  };

  const nSel = importRows.filter(r=>importSel[r._id]).length;
  const nDup = importRows.filter(r=>r._dup).length;
  const nSelTx = Object.keys(selTxs).filter(id=>selTxs[id]).length;

  const txDisplay = t => {
    let accInfo="";
    if(t.accFrom&&t.accTo) accInfo=(accNameOf(t.accFrom)||"?")+" → "+(accNameOf(t.accTo)||"?");
    else if(t.accFrom) accInfo=accNameOf(t.accFrom);
    else if(t.accTo)   accInfo=accNameOf(t.accTo);
    if(isTransfer(t)) return {bg:TRANSFER.bg, emoji:TRANSFER.emoji, color:TRANSFER.color, sign:"", accInfo:accInfo};
    const s=SECTIONS[t.sk]||SECTIONS.variaveis;
    const ds=s.sign*iSign(t.sk,t.cat);
    return {bg:s.bg, emoji:s.emoji, color:ds>0?"#16a34a":"#dc2626", sign:ds>0?"+":"-", accInfo:accInfo};
  };

  const AccSelect = props => (
    <select value={props.value} onChange={e=>props.onChange(e.target.value)}
      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:border-blue-400 outline-none">

                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white outline-none">
                    {Object.keys(SECTIONS).map(k=><option key={k} value={k}>{SECTIONS[k].emoji+" "+SECTIONS[k].label}</option>)}

                byMonth[t.sk][mo]+=iSign(t.sk,t.cat)*t.amt;
                if(SECTIONS[t.sk].sign<0){
                  if(!yearCats[t.cat]) yearCats[t.cat]={value:0,color:SECTIONS[t.sk].color};
                  yearCats[t.cat].value+=t.amt;
                }
              });
              const despMes = MS.map((m,i)=>({m:m, v:byMonth.essenciais[i]+byMonth.variaveis[i]}));
              const rendMes = MS.map((m,i)=>({m:m, v:byMonth.rendimentos[i]}));
              const poupMes = MS.map((m,i)=>({m:m, v:byMonth.poupancas[i]}));
              const totR=byMonth.rendimentos.reduce((a,b)=>a+b,0);
              const totP=byMonth.poupancas.reduce((a,b)=>a+b,0);
              const totE=byMonth.essenciais.reduce((a,b)=>a+b,0);
              const totV=byMonth.variaveis.reduce((a,b)=>a+b,0);
              const saldoAno = totR-totP-totE-totV;
              const taxaAno = totR>0?totP/totR*100:0;
              const yearPie = [{name:"Poupanças",value:totP,color:"#2563eb"},{name:"Recorrentes",value:totE,color:"#ea580c"},{name:"Variáveis",value:totV,color:"#dc2626"}].filter(d=>d.value>0);
              const topYear = Object.keys(yearCats).map(c=>({name:c,value:yearCats[c].value,color:yearCats[c].color}));
              topYear.sort((a,b)=>b.value-a.value);
              const totOut = totE+totV+totP;
              if (yearTxs.length===0) return <div className="bg-white rounded-2xl shadow-sm p-8 text-center text-gray-400 text-sm">Sem dados para {year}</div>;
              return (
                <div className="space-y-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm">
                    <div className="text-xs text-gray-400 mb-1">Resumo de {year}</div>
                    <div className={"text-3xl font-bold "+(saldoAno>=0?"text-green-600":"text-red-500")}>{fmt(saldoAno)}</div>
                    <div className="mt-3 pt-3 border-t border-gray-100 grid grid-cols-2 gap-3">
                      <div><div className="text-xs text-gray-400">Rendimento</div><div className="text-sm font-bold text-green-600">{fmt(totR)}</div></div>
                      <div><div className="text-xs text-gray-400">Poupanças</div><div className="text-sm font-bold text-blue-600">{fmt(totP)} ({taxaAno.toFixed(0)}%)</div></div>
                      <div><div className="text-xs text-gray-400">Recorrentes</div><div className="text-sm font-bold text-orange-600">{fmt(totE)}</div></div>
                      <div><div className="text-xs text-gray-400">Variáveis</div><div className="text-sm font-bold text-red-600">{fmt(totV)}</div></div>
                    </div>
                  </div>
                  <div className="bg-white rounded-2xl shadow-sm p-4">
                    <h3 className="font-semibold text-sm text-gray-700 mb-3">Despesas por mês</h3>
                    <MonthBars data={despMes} color="#ea580c"/>
                  </div>
                  <div className="bg-white rounded-2xl shadow-sm p-4">
                    <h3 className="font-semibold text-sm text-gray-700 mb-3">Rendimentos por mês</h3>
                    <MonthBars data={rendMes} color="#16a34a"/>
                  </div>
                  <div className="bg-white rounded-2xl shadow-sm p-4">
                    <h3 className="font-semibold text-sm text-gray-700 mb-3">Poupanças por mês</h3>
                    <MonthBars data={poupMes} color="#2563eb"/>
                  </div>
                  {yearPie.length>0 ? (
                    <div className="bg-white rounded-2xl shadow-sm p-4">
                      <h3 className="font-semibold text-sm text-gray-700 mb-3">Distribuição do ano</h3>
                      <SimplePie data={yearPie}/>
                    </div>
                  ) : null}
                  {topYear.length>0 ? (
                    <div className="bg-white rounded-2xl shadow-sm p-4">
                      <h3 className="font-semibold text-sm text-gray-700 mb-3">Top Categorias do ano</h3>
                      <div className="space-y-2.5">
                        {topYear.slice(0,10).map(c=>{
                          const pct=totOut>0?c.value/totOut*100:0;
                          return (
                            <div key={c.name} className="flex items-center gap-2">
                              <div className="text-xs text-gray-600 truncate flex-shrink-0" style={{width:120}}>{c.name}</div>
                              <div className="flex-1 bg-gray-100 rounded-full h-1.5"><div className="h-1.5 rounded-full" style={{width:pct+"%",backgroundColor:c.color}}/></div>
                              <div className="text-xs font-medium text-gray-700 text-right flex-shrink-0" style={{width:70}}>{fmt(c.value)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ) : null}
                </div>
              );
            })()}
          </div>
        ) : null}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-10">
        <div className="max-w-xl mx-auto flex">
          {[{id:"resumo",icon:"📊",label:"Resumo"},{id:"lancar",icon:"➕",label:"Lançar"},{id:"detalhe",icon:"📋",label:"Detalhe"},{id:"contas",icon:"💼",label:"Contas"},{id:"graficos",icon:"📈",label:"Gráficos"},{id:"importar",icon:"📥",label:"Importar"}].map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)}
              className={"flex-1 py-2 flex flex-col items-center gap-0.5 "+(tab===n.id?"text-blue-600":"text-gray-400")}>
              <span className="text-lg">{n.icon}</span><span style={{fontSize:10}}>{n.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
